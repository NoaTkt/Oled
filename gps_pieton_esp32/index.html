<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GPS pieton et OLED</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#101418;--panel:#1a222b;--panel2:#222d38;--line:#344352;--text:#edf2f5;--muted:#9eabb5;--accent:#4fd1c5;--blue:#5b8cff;--bad:#ff7272}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}header{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}h1{font-size:16px;color:var(--accent);margin:0}.tabs{display:flex;gap:5px}.tab,button{border:1px solid var(--line);border-radius:6px;background:var(--panel2);color:var(--text);padding:8px 12px;cursor:pointer}.tab.active,button.primary{background:var(--blue);border-color:var(--blue)}.status{margin-left:auto;color:var(--muted)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#68737d;margin-right:6px}.dot.on{background:#4fd17a}.dot.bad{background:var(--bad)}main{display:none;padding:14px;gap:14px}main.active{display:flex}.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}.editor{flex:1;display:grid;grid-template-columns:190px minmax(280px,1fr) 220px;gap:14px}.side{display:flex;flex-direction:column;gap:8px}.side h2,.card h2{font-size:12px;color:var(--muted);text-transform:uppercase;margin:0 0 5px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px}input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:5px;padding:7px}textarea{resize:vertical}.canvasbox{display:flex;flex-direction:column;align-items:center;gap:10px}.oled{width:min(100%,640px);height:auto;aspect-ratio:2/1;background:#000;border:5px solid #303030;image-rendering:pixelated;touch-action:none}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.check{color:var(--muted);font-size:12px}.list{list-style:none;margin:5px 0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:150px;overflow:auto}.list li{display:flex;justify-content:space-between;padding:6px;background:var(--panel2);border-radius:4px;cursor:pointer}.list li.sel{outline:1px solid var(--accent)}.danger{color:var(--bad)}#map{height:44vh;min-height:260px;flex:1}.gpspanel{width:330px;display:flex;flex-direction:column;gap:9px}.gpspanel label,.props label{font-size:12px;color:var(--muted)}#editorView{flex-direction:column}.prompter{max-width:720px;margin:auto;width:100%;display:flex;flex-direction:column;gap:12px}.hidden{display:none}@media(max-width:800px){.editor{grid-template-columns:1fr}.gpspanel{width:auto}main#navView{flex-direction:column}}
</style></head>
<body>
<header><h1>GPS pieton + OLED</h1><div class="tabs"><button class="tab active" data-view="navView">Navigation</button><button class="tab" data-view="editorView">Editeur OLED</button><button class="tab" data-view="promptView">Prompteur</button></div><div class="status"><span id="dot" class="dot"></span><span id="state">Déconnecté</span></div></header>
<main id="navView" class="active"><div id="map"></div><section class="card gpspanel"><h2>Navigation GPS</h2><label>Broker MQTT sécurisé</label><input id="broker" value="wss://broker.hivemq.com:8884/mqtt"><label>Identifiant du topic</label><input id="channel" value="noa-gps-pieton"><p id="help">Cliquez sur la carte pour choisir une destination.</p><div class="row"><button id="start" class="primary">Démarrer</button><button id="stop" disabled>Arrêter</button></div><div id="gpsStatus">GPS inactif</div></section></main>
<main id="editorView"><div class="editor"><section class="card side"><h2>Ajouter</h2><div class="tools"><button data-add="text">Texte</button><button data-add="time">Heure</button><button data-add="date">Date</button><button data-add="timer">Minuteur</button><button data-add="rect">Rectangle</button><button data-add="line">Ligne</button></div><button id="addImage">Image</button><input id="imageFile" class="hidden" type="file" accept="image/*"><h2>Elements</h2><ul id="elements" class="list"></ul></section><section class="card canvasbox"><h2>Aperçu 128 x 64</h2><canvas id="stage" class="oled" width="128" height="64"></canvas><div class="row"><button id="send" class="primary">Envoyer à l'écran</button><label class="check"><input id="auto" type="checkbox" checked> temps réel</label><label class="check"><input id="invert" type="checkbox"> inverser</label></div></section><section class="card props"><h2>Propriétés</h2><div id="noProps">Sélectionnez un élément.</div><div id="propsForm"></div></section></div></main>
<main id="promptView"><section class="card prompter"><h2>Prompteur</h2><label>Texte</label><textarea id="promptText" rows="4">Votre texte ici</textarea><div class="row"><label>Vitesse <input id="speed" type="number" min="2" max="200" value="20"></label><label>Taille <input id="font" type="number" min="6" max="32" value="12"></label><label>Direction <select id="direction"><option value="up">Bas vers haut</option><option value="left">Droite vers gauche</option></select></label></div><div class="row"><button id="play" class="primary">Lecture</button><button id="pause">Pause</button><button id="reset">Reset</button></div><canvas id="promptStage" class="oled" width="128" height="64"></canvas></section></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script>
'use strict';const W=128,H=64,FRAME_TOPIC=()=>document.getElementById('channel').value.trim()+'/frame',GPS_TOPIC=()=>document.getElementById('channel').value.trim()+'/gpstopic';let mqttClient=null,watchId=null,heading=null,destination=null,meMarker=null,destMarker=null;
const $=id=>document.getElementById(id),clean=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9 ?!.,:'-]/g,'');function state(text,kind=''){ $('state').textContent=text;$('dot').className='dot '+kind }
function connect(){if(mqttClient&&mqttClient.connected)return true;try{mqttClient=mqtt.connect($('broker').value.trim(),{clientId:'oled-'+Math.random().toString(16).slice(2),clean:true});mqttClient.on('connect',()=>state('MQTT sécurisé','on'));mqttClient.on('error',()=>state('Erreur MQTT','bad'));return true}catch(e){state('URL MQTT invalide','bad');return false}}function publish(topic,data){if(mqttClient&&mqttClient.connected)mqttClient.publish(topic,data,{qos:0,retain:false})}
function rad(v){return v*Math.PI/180}function deg(v){return v*180/Math.PI}function distance(a,b,c,d){let x=rad(c-a),y=rad(d-b),q=Math.sin(x/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(y/2)**2;return 6371000*2*Math.atan2(Math.sqrt(q),Math.sqrt(1-q))}function bearing(a,b,c,d){return(deg(Math.atan2(Math.sin(rad(d-b))*Math.cos(rad(c)),Math.cos(rad(a))*Math.sin(rad(c))-Math.sin(rad(a))*Math.cos(rad(c))*Math.cos(rad(d-b))))+360)%360}
const map=L.map('map').setView([44.558,4.755],15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);map.on('click',e=>{destination=e.latlng;if(destMarker)destMarker.setLatLng(destination);else destMarker=L.marker(destination).addTo(map);$('help').textContent='Destination : '+destination.lat.toFixed(5)+', '+destination.lng.toFixed(5)});
function orientation(e){heading=e.webkitCompassHeading!==undefined?e.webkitCompassHeading:e.alpha===null?null:(360-e.alpha)%360}function position(p){let a=p.coords.latitude,b=p.coords.longitude;if(meMarker)meMarker.setLatLng([a,b]);else{meMarker=L.circleMarker([a,b],{radius:6,color:'blue'}).addTo(map);map.setView([a,b])}if(!destination){$('gpsStatus').textContent='Choisissez une destination.';return}let d=distance(a,b,destination.lat,destination.lng),angle=bearing(a,b,destination.lat,destination.lng);if(heading!==null)angle=(angle-heading+360)%360;publish(GPS_TOPIC(),JSON.stringify({d:Math.round(d),a:Math.round(angle)}));$('gpsStatus').textContent='Distance : '+Math.round(d)+' m | angle : '+Math.round(angle)+'°'}
$('start').onclick=async()=>{if(!connect())return;if(typeof DeviceOrientationEvent?.requestPermission==='function'){try{await DeviceOrientationEvent.requestPermission()}catch(e){}}window.addEventListener('deviceorientation',orientation,true);window.addEventListener('deviceorientationabsolute',orientation,true);watchId=navigator.geolocation.watchPosition(position,e=>$('gpsStatus').textContent='Erreur GPS : '+e.message,{enableHighAccuracy:true,maximumAge:1000,timeout:15000});$('start').disabled=true;$('stop').disabled=false;$('gpsStatus').textContent='Recherche de la position...'};$('stop').onclick=()=>{if(watchId!==null)navigator.geolocation.clearWatch(watchId);if(mqttClient)mqttClient.end();window.removeEventListener('deviceorientation',orientation,true);window.removeEventListener('deviceorientationabsolute',orientation,true);$('start').disabled=false;$('stop').disabled=true;$('gpsStatus').textContent='GPS inactif';state('Déconnecté')};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('main,.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.view).classList.add('active')});
const canvas=$('stage'),ctx=canvas.getContext('2d');let items=[],next=1,selected=null,drag=null;function textOf(e){let d=new Date();if(e.type==='text')return e.text;if(e.type==='time')return d.toTimeString().slice(0,8);if(e.type==='date')return d.toLocaleDateString('fr-FR');let n=Math.max(0,Math.ceil((e.end-Date.now())/1000));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function bounds(e){if(['text','time','date','timer'].includes(e.type)){ctx.font=e.size+'px monospace';return{x:e.x,y:e.y,w:Math.max(5,ctx.measureText(textOf(e)).width),h:e.size+2}}return{x:e.x,y:e.y,w:e.w||5,h:e.h||5}}
function draw(){ctx.fillStyle=$('invert').checked?'#fff':'#000';ctx.fillRect(0,0,W,H);ctx.fillStyle=$('invert').checked?'#000':'#fff';items.forEach(e=>{if(['text','time','date','timer'].includes(e.type)){ctx.font=e.size+'px monospace';ctx.textBaseline='top';ctx.fillText(clean(textOf(e)),e.x,e.y)}else if(e.type==='rect'){e.fill?ctx.fillRect(e.x,e.y,e.w,e.h):ctx.strokeRect(e.x+.5,e.y+.5,e.w-1,e.h-1)}else if(e.type==='line'){ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(e.x+e.w,e.y+e.h);ctx.stroke()}else if(e.image)ctx.drawImage(e.image,e.x,e.y,e.w,e.h);if(e.id===selected){let b=bounds(e);ctx.strokeStyle='#4fd1c5';ctx.strokeRect(b.x-1,b.y-1,b.w+2,b.h+2);ctx.strokeStyle=$('invert').checked?'#000':'#fff'}});if($('auto').checked)send(canvas)}
function pack(c){let d=c.getContext('2d').getImageData(0,0,W,H).data,b=new Uint8Array(1024);for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(d[(y*W+x)*4]>127)b[y*16+(x>>3)]|=1<<(x&7);return b}function send(c){if(mqttClient?.connected)publish(FRAME_TOPIC(),pack(c))}
function refresh(){let list=$('elements');list.innerHTML='';items.forEach(e=>{let li=document.createElement('li');li.className=e.id===selected?'sel':'';li.textContent=e.type+' #'+e.id;let x=document.createElement('button');x.textContent='x';x.onclick=ev=>{ev.stopPropagation();items=items.filter(i=>i!==e);selected=null;refresh()};li.appendChild(x);li.onclick=()=>{selected=e.id;refresh()};list.appendChild(li)});let e=items.find(i=>i.id===selected),form=$('propsForm');form.innerHTML='';$('noProps').classList.toggle('hidden',!!e);if(!e)return;[['X','x'],['Y','y']].forEach(([n,k])=>{let l=document.createElement('label');l.textContent=n;let i=document.createElement('input');i.type='number';i.value=e[k];i.oninput=()=>{e[k]=+i.value;draw()};l.appendChild(i);form.appendChild(l)});if(e.type==='text'){let l=document.createElement('label');l.textContent='Texte';let i=document.createElement('textarea');i.value=e.text;i.oninput=()=>{e.text=i.value;draw()};l.appendChild(i);form.appendChild(l)}if(['text','time','date','timer'].includes(e.type)){let l=document.createElement('label');l.textContent='Taille';let i=document.createElement('input');i.type='number';i.min=6;i.max=32;i.value=e.size;i.oninput=()=>{e.size=+i.value;draw()};l.appendChild(i);form.appendChild(l)}if(['rect','line'].includes(e.type)){['w','h'].forEach(k=>{let i=document.createElement('input');i.type='number';i.value=e[k];i.oninput=()=>{e[k]=+i.value;draw()};form.appendChild(i)})}}
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{let e={id:next++,type:b.dataset.add,x:5,y:5,size:12,w:30,h:15};if(e.type==='text')e.text='Mon texte';if(e.type==='timer')e.end=Date.now()+60000;items.push(e);selected=e.id;refresh();draw()});$('addImage').onclick=()=>$('imageFile').click();$('imageFile').onchange=e=>{let f=e.target.files[0],im=new Image();if(!f)return;im.onload=()=>{items.push({id:next++,type:'image',x:0,y:0,w:32,h:32,image:im});selected=next-1;refresh();draw()};im.src=URL.createObjectURL(f)};$('send').onclick=()=>send(canvas);$('invert').onchange=draw;
function point(e){let r=canvas.getBoundingClientRect();return{x:Math.floor((e.clientX-r.left)*W/r.width),y:Math.floor((e.clientY-r.top)*H/r.height)}}canvas.onmousedown=e=>{let p=point(e);let hit=[...items].reverse().find(i=>{let b=bounds(i);return p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h});selected=hit?.id||null;if(hit)drag={e:hit,dx:p.x-hit.x,dy:p.y-hit.y};refresh()};window.onmousemove=e=>{if(!drag)return;let p=point(e);drag.e.x=Math.max(0,Math.min(W-5,p.x-drag.dx));drag.e.y=Math.max(0,Math.min(H-5,p.y-drag.dy));draw()};window.onmouseup=()=>drag=null;setInterval(()=>{if(items.some(e=>['time','date','timer'].includes(e.type)))draw()},500);
const pc=$('promptStage'),pctx=pc.getContext('2d');let running=false,pos=0,last=0;function promptDraw(){pctx.fillStyle='#000';pctx.fillRect(0,0,W,H);pctx.fillStyle='#fff';let t=clean($('promptText').value),size=+$('font').value;pctx.font=size+'px monospace';pctx.textBaseline='top';if($('direction').value==='left')pctx.fillText(t,W-pos,(H-size)/2);else pctx.fillText(t,0,H-pos)}function loop(t){if(!running)return;if(last)pos+=(t-last)*(+$('speed').value)/1000;last=t;promptDraw();if(t%80<20)send(pc);requestAnimationFrame(loop)}$('play').onclick=()=>{running=true;last=0;requestAnimationFrame(loop)};$('pause').onclick=()=>running=false;$('reset').onclick=()=>{pos=0;promptDraw();send(pc)};refresh();draw();promptDraw();
</script></body></html>
